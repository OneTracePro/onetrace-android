name: CI

on:
  push:
    branches: [main]
    tags: ['v*', '[0-9]*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Unit tests and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (Robolectric), release builds, Maven publication as JitPack builds it
        run: ./gradlew --no-daemon :onetrace:testDebugUnitTest :onetrace:assembleRelease :onetrace-fcm:assembleRelease :onetrace:publishReleasePublicationToMavenLocal :onetrace-fcm:publishReleasePublicationToMavenLocal
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: onetrace/build/reports/tests
